name: Deploy

on:
  push:
    branches: [main]
    paths: ["index.html", "og.png", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BUCKET: go-sports-skills-sh
  DISTRIBUTION_ID: E34HXPZLTKORCP

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::677276098343:role/sports-skills-landing-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp index.html "s3://$BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp og.png "s3://$BUCKET/og.png" \
            --content-type "image/png" --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/" "/og.png" --query Invalidation.Id --output text

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS https://go.sports-skills.sh/ | grep -q "Live sports in every agent"
          curl -fsSI https://go.sports-skills.sh/og.png | grep -qi "content-type: image/png"
          echo "Live: https://go.sports-skills.sh"
